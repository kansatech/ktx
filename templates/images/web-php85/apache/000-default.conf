<VirtualHost *:8080>
    ServerName _
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    Alias /__ktx/health /opt/ktx-health/index.html
    <Location /__ktx/health>
        Require all granted
    </Location>

    # Pipe web logs through logger so the site rsyslog process forwards them
    # to ktx-log-01 as well as Docker retaining supervisor/service stderr.
    ErrorLog "|/usr/bin/logger -t apache-error"
    CustomLog "|/usr/bin/logger -t apache-access" combined
</VirtualHost>
