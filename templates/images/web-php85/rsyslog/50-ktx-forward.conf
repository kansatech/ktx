# Forward site syslog over TCP to the central log service.
# The linked-list queue allows short central-logger outages without blocking callers.
action(
  type="omfwd"
  target="ktx-log-01"
  port="514"
  protocol="tcp"
  action.resumeRetryCount="-1"
  queue.type="linkedList"
  queue.filename="ktx_forward"
  queue.saveOnShutdown="on"
)
