user www-data DOCKER_SOCKET_GROUP;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream docker_socket {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        # Docker clients may negotiate a version first.
        location = /_ping {
            limit_except GET HEAD { deny all; }
            proxy_pass http://docker_socket;
        }
        location = /version {
            limit_except GET HEAD { deny all; }
            proxy_pass http://docker_socket;
        }
        location = /info {
            limit_except GET HEAD { deny all; }
            proxy_pass http://docker_socket;
        }

        # Versioned read-only endpoints Traefik's Docker provider needs.
        location ~ ^/v[0-9.]+/(info|version|containers/json|containers/[^/]+/json|events|networks|networks/[^/]+)$ {
            limit_except GET HEAD { deny all; }
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_pass http://docker_socket;
        }

        location / { return 403; }
    }
}
